# Example settings for GhostVidStream (shell) / libghost_ndihx (NDI|HX module)
# Copy to e.g. ~/.config/ghostvidstream/viewer.conf and pass --config PATH

# Prefer the test camera by IP (substring match on name or url)
ip=172.16.1.189

# Prefer NDI|HX sources when picking (NDI|HX module)
prefer_hx=true

# Keep searching the LAN until a match appears / returns
auto_search=true

# Discovery backend: auto (Bonjour then NDI SDK) | bonjour | ndi_sdk
discover=auto

# Discovery timing
find_ms=4000
rescan_ms=3000
noframe_ms=8000

# First capture wait inside libghost_ndihx (ms). Lower = lower latency; 0 = poll.
# Does not change resolution/quality.
capture_wait_ms=8

# Receiver bandwidth: highest (full) or lowest (smaller decode footprint)
bandwidth=highest

# Display efficiency (viewer only — does not re-encode the camera)
# max_w=1280
# max_h=720
# fps_cap=30
# hz=60

# Protocol: ghost_ndihx | srt | rtmp | rtsp
# protocol=ghost_ndihx
# url=srt://172.16.1.189:1600

# Kiosk: hide controls/HUD/cursor after idle (ms)
# auto_hide=true
# auto_hide_ms=4000

# fullscreen=false
# stats=true
