# Example settings for ghostvidstream / libghost_ndihx
# Copy to e.g. ~/.config/ndi-hx/viewer.conf and pass --config PATH

# Prefer the test camera by IP (substring match on name or url)
ip=172.16.1.189

# Prefer NDI|HX sources when picking
prefer_hx=true

# Keep searching the LAN until a match appears / returns
auto_search=true

# Discovery timing
find_ms=4000
rescan_ms=3000
noframe_ms=8000

# First capture wait inside libghost_ndihx (ms). Lower = lower latency; 0 = poll.
# Does not change resolution/quality.
capture_wait_ms=8

# Receiver bandwidth: highest (full) or lowest (smaller decode footprint)
bandwidth=highest

# Display efficiency (viewer only — does not re-encode the camera)
# max_w=1280
# max_h=720
# fps_cap=30
# hz=60

# fullscreen=false
# stats=true
